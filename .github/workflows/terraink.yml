name: Terraink Batch Export

on:
  workflow_dispatch:

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Terraink Debug
        run: |
          echo "=== AKTUELLER ORDNER ==="
          pwd

          echo "=== DATEIEN ==="
          ls -la

          echo "=== PYTHON VERSION ==="
          python --version

          echo "=== SYNTAXCHECK ==="
          python -m py_compile terraink_batch.py

          echo "=== STARTE SCRIPT ==="
          python -u terraink_batch.py

      - uses: actions/upload-artifact@v4
        with:
          name: terraink_downloads
          path: terraink_downloads/
